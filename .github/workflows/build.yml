name: Build PostIt APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug and release APKs
        run: gradle assembleDebug assembleRelease --stacktrace

      - name: Show signing SHA-1 (for Google Cloud Console)
        run: keytool -list -v -keystore postit.keystore -storepass postit123 -alias postit | grep -E "SHA1|SHA256"

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PostIt-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist/PostIt-release.apk

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: PostIt-apk
          path: dist/*.apk
          if-no-files-found: error
