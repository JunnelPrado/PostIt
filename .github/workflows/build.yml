name: Build PostIt APK

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project folder (unzips the project if it was uploaded as a .zip)
        run: |
          find_settings() {
            find . -maxdepth 5 \( -name settings.gradle.kts -o -name settings.gradle \) -not -path './.git/*' | head -n1
          }
          SETTINGS=$(find_settings)
          if [ -z "$SETTINGS" ]; then
            echo "No settings.gradle.kts found, looking for a .zip to unzip..."
            find . -maxdepth 3 -name '*.zip' -not -path './.git/*' | while read -r z; do
              echo "Unzipping $z"
              unzip -oq "$z" -d unzipped
            done
            SETTINGS=$(find_settings)
          fi
          if [ -z "$SETTINGS" ]; then
            echo "Files in repo:"
            find . -maxdepth 3 -not -path './.git/*' | sort
            echo "::error::Could not find settings.gradle.kts. Upload the project files or the project .zip."
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "Project folder: $DIR"
          ls -la "$DIR"
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle assembleDebug --console=plain

      - name: Collect APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/PostIt.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PostIt-apk
          path: ${{ env.PROJECT_DIR }}/dist/PostIt.apk
          if-no-files-found: error

      # Push a tag such as v1.0 to publish a Release with the APK attached
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.PROJECT_DIR }}/dist/PostIt.apk
